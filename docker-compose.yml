# MyVoIP 着信制御サービス（MikoPBX とは別の Linux 環境で動かす）
#
#   cp .env.example .env   # 値を記入（COMPOSE_PROFILES で caddy / nginx を選ぶ）
#   mkdir -p secrets && cp AuthKey_XXXXXXXXXX.p8 secrets/apns.p8
#   docker compose up -d --build
#
# 詳しくは README.md を参照。
#
# 外部に直接公開しない LAN・VPN 内での利用を前提に、HTTP（MYVOIP_TLS=off）も選べる。
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: myvoip
      POSTGRES_USER: myvoip
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD を .env に設定してください}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myvoip -d myvoip"]
      interval: 5s
      timeout: 3s
      retries: 20

  myvoip:
    build: .
    image: myvoip-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://myvoip:${DB_PASSWORD}@db:5432/myvoip?sslmode=disable
      APNS_KEY_FILE: /run/secrets/apns.p8
      RELAY_CONFIG_DIR: /srv/asterisk-myvoip
      TZ: Asia/Tokyo
    volumes:
      - ./secrets:/run/secrets:ro
      - relay_config:/srv/asterisk-myvoip
    depends_on:
      db:
        condition: service_healthy
      asterisk:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "/usr/local/bin/myvoip-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 中継用 Asterisk（COMPOSE_PROFILES に relay を含めたときだけ起動）
  # MikoPBX に内線として常時登録し、iPhone の登録先になる。SIP・RTP のため host ネットワークで動かす。
  # ARI は Compose のネットワークのゲートウェイだけで待ち受け、myvoip コンテナ以外からは届かない。
  asterisk:
    profiles: ["relay"]
    build: ./asterisk
    image: myvoip-asterisk:latest
    restart: unless-stopped
    network_mode: host
    environment:
      ARI_USER: ${ARI_USER:-myvoip}
      ARI_PASSWORD: ${ARI_PASSWORD:?ARI_PASSWORD を .env に設定してください}
      ARI_BIND_ADDRESS: ${MYVOIP_DOCKER_GATEWAY:-10.211.0.1}
      RELAY_SIP_PORT: ${RELAY_SIP_PORT:-5060}
      RELAY_RTP_START: ${RELAY_RTP_START:-10000}
      RELAY_RTP_END: ${RELAY_RTP_END:-10999}
      TZ: Asia/Tokyo
    volumes:
      - relay_config:/etc/asterisk/myvoip
      - relay_spool:/var/spool/asterisk

  # リバースプロキシは .env の COMPOSE_PROFILES=caddy または nginx で選ぶ
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/caddy/${MYVOIP_TLS:-off}.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    depends_on:
      - myvoip

  nginx:
    profiles: ["nginx"]
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/nginx/${MYVOIP_TLS:-off}.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    depends_on:
      - myvoip

networks:
  default:
    ipam:
      config:
        # 中継用 Asterisk の ARI はこのネットワークのゲートウェイで待ち受ける（LAN と重ならない範囲にする）
        - subnet: ${MYVOIP_DOCKER_SUBNET:-10.211.0.0/24}
          gateway: ${MYVOIP_DOCKER_GATEWAY:-10.211.0.1}

volumes:
  db:
  caddy_data:
  relay_config:
  relay_spool:
