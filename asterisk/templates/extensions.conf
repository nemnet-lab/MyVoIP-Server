[general]
static=yes
writeprotect=yes

[globals]

; どのエンドポイントにも属さない呼は受けない
[default]
exten => _X.,1,Hangup(21)

; MikoPBX から内線（例 9002）宛ての着信 → 呼制御（Push で iPhone を起こしてつなぐ）
[from-pbx]
exten => _[0-9a-zA-Z+*#]!,1,NoOp(MyVoIP inbound to ${MYVOIP_EXT} from ${CALLERID(num)})
 same => n,Stasis(myvoip,${MYVOIP_EXT})
 same => n,Hangup()
; 終話時の h 拡張子が上のパターンに一致して、もう一度 Stasis に入らないようにする
; （h の優先順位2がないと、優先順位2だけパターン側の Stasis に落ちるため、ここで終える）
exten => h,1,NoOp()
 same => n,Hangup()

; iPhone からの発信 → MikoPBX へ、その内線からの発信として送る
[from-mobile]
exten => _[0-9*#+]!,1,NoOp(MyVoIP outbound from ${MYVOIP_EXT} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@myvoip-up-${MYVOIP_EXT},120)
 same => n,Hangup()
