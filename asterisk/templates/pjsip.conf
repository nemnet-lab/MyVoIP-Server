[global]
type=global
user_agent=MyVoIP-Relay
; MikoPBX からの INVITE は、登録時の Contact に付けた line パラメーターで内線ごとのエンドポイントに対応付ける
endpoint_identifier_order=line,ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:${RELAY_SIP_PORT}

; 内線ごとの設定は myvoip-server が生成する（extension set / relay sync）
#tryinclude myvoip/pjsip_myvoip.conf
