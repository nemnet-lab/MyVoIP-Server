name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i 's/^ARI_PASSWORD=.*/ARI_PASSWORD=ci/' .env
          docker compose config --quiet
          COMPOSE_PROFILES=nginx,relay docker compose config --quiet
      - name: Build images
        run: COMPOSE_PROFILES=caddy,relay docker compose build myvoip asterisk
